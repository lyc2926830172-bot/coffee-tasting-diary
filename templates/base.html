<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}一杯之间{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script defer src="{{ url_for('static', filename='effects.js') }}"></script></head><body><div class="grain"></div><header class="site-header"><div class="shell nav-wrap"><a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark">◒</span><span>一杯之间<small>Coffee tasting diary</small></span></a><nav><a href="{{ url_for('dashboard') }}">首页</a><a href="{{ url_for('beans') }}">豆子档案</a><a href="{{ url_for('notes') }}">品鉴日记</a><a href="{{ url_for('insights') }}">风味洞察</a></nav></div></header><main class="shell">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer class="shell"><span>从一粒豆开始，记录每一次感受。</span><span>留住一杯，也留住当时的自己。</span></footer></body></html>
